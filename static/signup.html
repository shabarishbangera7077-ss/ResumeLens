<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account — ResumeLens</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body>
  <header class="topbar"><a class="brand" href="/">ResumeLens</a><nav class="nav"><a href="/static/login.html">Log in</a></nav></header>
  <main class="container narrow"><section class="card stack"><div><span class="eyebrow">Get started</span><h1>Create account</h1></div>
    <div id="error" class="notice" role="alert"></div>
    <form id="signup-form" class="stack">
      <label>Name<input name="name" autocomplete="name" maxlength="120" required></label>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label>
      <button type="submit">Create account</button>
    </form><p>Already registered? <a href="/static/login.html">Log in</a></p>
  </section></main>
  <script src="/static/js/api.js"></script><script src="/static/js/auth.js"></script>
</body></html>
