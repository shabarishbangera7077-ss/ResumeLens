<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in — ResumeLens</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body>
  <header class="topbar"><a class="brand" href="/">ResumeLens</a><nav class="nav"><a href="/static/signup.html">Create account</a></nav></header>
  <main class="container narrow"><section class="card stack"><div><span class="eyebrow">Welcome back</span><h1>Log in</h1></div>
    <div id="error" class="notice" role="alert"></div>
    <form id="login-form" class="stack">
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Log in</button>
    </form><p>New here? <a href="/static/signup.html">Create an account</a></p>
  </section></main>
  <script src="/static/js/api.js"></script><script src="/static/js/auth.js"></script>
</body></html>
